services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music_genre_classifier
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MPLCONFIGDIR=/tmp/matplotlib
      - DJANGO_SETTINGS_MODULE=MusicClassification.settings
    volumes:
      - ./media:/app/media
